<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — DepliantApp</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a3c6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DepliantApp">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bleu: #1a3c6e; --bleu-clair: #eaf0fa; --gris: #666; --bordure: #ddd; --danger: #b23b3b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #1a3c6e 0%, #2a5a9e 55%, #0f2547 100%);
    color: #222;
  }
  .carte {
    background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  h1 { font-size: 1.3rem; color: var(--bleu); margin: 0 0 4px 0; text-align: center; }
  p.sous-titre { color: var(--gris); font-size: 0.85rem; text-align: center; margin: 0 0 20px 0; }
  label { display: block; font-size: 0.85rem; color: #333; margin-bottom: 4px; margin-top: 12px; }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--bordure); border-radius: 6px;
    font-size: 0.95rem;
  }
  input:focus { outline: 2px solid var(--bleu-clair); border-color: var(--bleu); }
  button {
    width: 100%; margin-top: 18px; padding: 10px; border: none; border-radius: 6px;
    background: var(--bleu); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #14315c; }
  button:disabled { opacity: 0.6; cursor: default; }
  .erreur {
    background: #fdeaea; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; margin-top: 14px; display: none;
  }
  .erreur.visible { display: block; }
  .hint { font-size: 0.78rem; color: var(--gris); margin-top: 10px; line-height: 1.4; }
  .hidden { display: none; }
  .champ-mdp { position: relative; }
  .champ-mdp input { padding-right: 34px; }
  .btn-voyant-mdp {
    position: absolute; right: 2px; top: 1px; width: auto; margin: 0;
    background: none; border: none; padding: 8px; font-size: 1rem;
    line-height: 1; cursor: pointer; color: var(--gris);
  }
  .btn-voyant-mdp:hover { background: none; color: var(--bleu); }
  
  /* Splash Screen */
  .splash {
    position: fixed; inset: 0; z-index: 10005;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(160deg, #1a3c6e 0%, #2a5a9e 55%, #0f2547 100%);
    color: white; opacity: 1; transition: opacity 0.4s ease;
  }
  .splash.hidden { opacity: 0; pointer-events: none; }
  .splash-symbole { animation: splash-respire 1.5s ease-in-out infinite; }
  .splash-symbole svg circle:first-child { animation: splash-tour 1.2s linear infinite; transform-origin: 50% 50%; }
  @keyframes splash-respire { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes splash-tour { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .splash-titre { font-size: 1.5rem; font-weight: bold; margin: 0; letter-spacing: 0.5px; }
  .splash-message { font-size: 0.85rem; opacity: 0.85; margin: 0; }
</style>
</head>
<body>
  <!-- Splash Screen initial avec dessin de colombe -->
  <div id="splash" class="splash">
    <div class="splash-symbole" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="120" height="120">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="80 200" opacity="0.85"/>
        <g fill="#ffffff">
          <!-- Corps et queue de la colombe -->
          <path d="M50 32 C47 32 43 35 43 40 C43 43 45 46 47 48 C44 54 38 64 30 72 C36 70 44 67 48 61 C49 65 50 71 50 75 C51 71 52 65 53 61 C57 67 65 70 71 72 C63 64 57 54 54 48 C56 46 58 43 58 40 C58 35 54 32 50 32 Z" opacity="0.95"/>
          <!-- Aile gauche déployée -->
          <path d="M46 42 C40 36 28 28 15 32 C13 32.5 14 34.5 16 35 C23 37 31 43 36 50 C40 46 43 43 46 42 Z" opacity="0.95"/>
          <!-- Aile droite déployée -->
          <path d="M54 42 C60 36 72 28 85 32 C87 32.5 86 34.5 84 35 C77 37 69 43 64 50 C60 46 57 43 54 42 Z" opacity="0.95"/>
          <!-- Tête, bec et rameau -->
          <circle cx="50" cy="30" r="4.5"/>
          <path d="M50 26 L50 21 L48.5 25 Z"/>
          <path d="M50 23 Q54 20 57 22 Q54 23 50 23" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
          <ellipse cx="57" cy="21.5" rx="2" ry="1" transform="rotate(-20 57 21.5)"/>
        </g>
      </svg>
    </div>
    <p id="splash-titre" class="splash-titre">DepliantApp</p>
    <p id="splash-message" class="splash-message">Chargement…</p>
  </div>

  <div class="carte">
    <h1>DepliantApp</h1>
    <p class="sous-titre">Connexion</p>

    <form id="form-login">
      <label for="login-username">Identifiant</label>
      <input id="login-username" type="text" placeholder="Votre identifiant" autocomplete="username" required autofocus>
      <label for="login-password">Mot de passe</label>
      <div class="champ-mdp">
        <input id="login-password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
        <button type="button" class="btn-voyant-mdp" aria-label="Afficher le mot de passe">👁</button>
      </div>
      <div class="erreur" id="login-erreur"></div>
      <button type="submit">Se connecter</button>
    </form>

    <form id="form-changement" class="hidden">
      <p class="hint" style="margin-bottom:16px;">Veuillez définir votre mot de passe pour sécuriser votre compte avant de continuer.</p>
      <input id="chg-actuel" type="hidden">
      
      <label for="chg-nouveau">Nouveau mot de passe personnalisé (8 caractères min.)</label>
      <div class="champ-mdp">
        <input id="chg-nouveau" type="password" autocomplete="new-password" required minlength="8">
        <button type="button" class="btn-voyant-mdp" aria-label="Afficher le mot de passe">👁</button>
      </div>
      <label for="chg-confirme">Confirmer le nouveau mot de passe</label>
      <div class="champ-mdp">
        <input id="chg-confirme" type="password" autocomplete="new-password" required minlength="8">
        <button type="button" class="btn-voyant-mdp" aria-label="Afficher le mot de passe">👁</button>
      </div>
      <div class="erreur" id="chg-erreur"></div>
      <button type="submit">Enregistrer et continuer</button>
    </form>
  </div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

async function api(url, options = {}) {
  const res = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Erreur");
  return data;
}

function afficherErreur(id, message) {
  const el = document.getElementById(id);
  el.textContent = message;
  el.classList.add("visible");
}
function masquerErreur(id) {
  document.getElementById(id).classList.remove("visible");
}

document.querySelectorAll(".btn-voyant-mdp").forEach((btn) => {
  btn.addEventListener("click", () => {
    const input = btn.previousElementSibling;
    const visible = input.type === "text";
    input.type = visible ? "password" : "text";
    btn.textContent = visible ? "👁" : "🙈";
    btn.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
  });
});

async function avecChargement(bouton, fn) {
  if (!bouton || bouton.disabled) return fn();
  const contenuOriginal = bouton.innerHTML;
  bouton.disabled = true;
  bouton.innerHTML = `<span class="spinner" aria-hidden="true"></span>${contenuOriginal}`;
  try {
    return await fn();
  } finally {
    bouton.disabled = false;
    bouton.innerHTML = contenuOriginal;
  }
}

async function initialiserSplashEtSession() {
  const debut = Date.now();
  try {
    const status = await api("/auth/status");
    if (status.authenticated && !status.must_change_password) {
      window.location.replace("/");
      return;
    }
  } catch (_) {}
  
  // Affiche la colombe au moins 1100ms pour un lancement soigné et élégant
  const ecoule = Date.now() - debut;
  const delai = Math.max(0, 1100 - ecoule);
  setTimeout(() => {
    const splash = document.getElementById("splash");
    if (splash) splash.classList.add("hidden");
  }, delai);
}

window.addEventListener("DOMContentLoaded", initialiserSplashEtSession);

let dernierMotDePasseSaisi = "";

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  masquerErreur("login-erreur");
  const username = (document.getElementById("login-username").value || "").trim();
  const password = document.getElementById("login-password").value;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  try {
    const data = await avecChargement(submitBtn, () => api("/auth/login", { method: "POST", body: JSON.stringify({ username, password }) }));
    if (data.must_change_password) {
      dernierMotDePasseSaisi = password;
      document.getElementById("form-login").classList.add("hidden");
      document.getElementById("form-changement").classList.remove("hidden");
      document.getElementById("chg-actuel").value = password;
    } else {
      const splash = document.getElementById("splash");
      const msg = document.getElementById("splash-message");
      if (msg) msg.textContent = "Connexion réussie…";
      if (splash) splash.classList.remove("hidden");
      setTimeout(() => { window.location.href = "/"; }, 350);
    }
  } catch (err) {
    afficherErreur("login-erreur", err.message);
  }
});

document.getElementById("form-changement").addEventListener("submit", async (e) => {
  e.preventDefault();
  masquerErreur("chg-erreur");
  const actuel = dernierMotDePasseSaisi || document.getElementById("chg-actuel").value;
  const nouveau = document.getElementById("chg-nouveau").value;
  const confirme = document.getElementById("chg-confirme").value;
  if (nouveau !== confirme) {
    afficherErreur("chg-erreur", "Les deux mots de passe ne correspondent pas.");
    return;
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  try {
    await avecChargement(submitBtn, () => api("/auth/change-password", {
      method: "POST",
      body: JSON.stringify({ mot_de_passe_actuel: actuel, nouveau_mot_de_passe: nouveau }),
    }));
    const splash = document.getElementById("splash");
    const msg = document.getElementById("splash-message");
    if (msg) msg.textContent = "Ouverture de votre espace…";
    if (splash) splash.classList.remove("hidden");
    setTimeout(() => { window.location.href = "/"; }, 350);
  } catch (err) {
    afficherErreur("chg-erreur", err.message);
  }
});
</script>
</body>
</html>
